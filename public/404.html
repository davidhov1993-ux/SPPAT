<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/sppat-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sppat — Pagina niet gevonden</title>
    <!-- Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0;
      var l = window.location;
      if (l.pathname !== '/404' && l.pathname !== '/404/' && l.pathname !== '/404.html') {
        l.replace(
          l.protocol + '//' + l.host + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div style="font-family: sans-serif; padding: 40px; text-align: center;">
        <h1>404 — Pagina niet gevonden</h1>
        <p>Doorsturen naar Sppat...</p>
        <p><a href="/">Klik hier als u niet automatisch wordt doorgestuurd</a></p>
      </div>
    </div>
  </body>
</html>
